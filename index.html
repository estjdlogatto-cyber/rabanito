<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carta Romántica - Nebulosa y Fotos Estilo Carta</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: 'Arial', sans-serif;
      text-align: center;
      touch-action: none;
    }

    canvas { 
      display: block; 
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
      transition: opacity 2s ease;
    }

    #startBtn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 14px 40px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, #ff0044, #cc0033 60%, #ff3366);
      background-size: 200% 200%;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 0, 68, 0.6), 0 0 35px rgba(255, 51, 204, 0.3);
      z-index: 20;
      transition: all 0.3s ease;
      letter-spacing: 2px;
      animation: btnPulse 2.2s ease-in-out infinite, btnShimmer 4s ease infinite;
    }

    @keyframes btnPulse {
      0%, 100% { box-shadow: 0 0 15px rgba(255, 0, 68, 0.6), 0 0 35px rgba(255, 51, 204, 0.3); }
      50% { box-shadow: 0 0 25px rgba(255, 0, 68, 0.9), 0 0 55px rgba(255, 51, 204, 0.6); }
    }

    @keyframes btnShimmer {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    #startBtn:hover {
      background: linear-gradient(135deg, #ff3366, #ff0044 60%, #ff66cc);
      box-shadow: 0 0 30px rgba(255, 0, 68, 1), 0 0 60px rgba(255, 51, 204, 0.7);
      transform: translate(-50%, -50%) scale(1.08);
    }

    #mainContent { 
      display: none; 
      animation: fadeIn 3s ease-in-out;
      position: relative;
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 50px;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .space-nebula {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: 
        radial-gradient(circle at 15% 50%, rgba(76, 0, 115, 0.5), transparent 40%),
        radial-gradient(circle at 85% 30%, rgba(204, 0, 102, 0.4), transparent 50%),
        radial-gradient(circle at 50% 80%, rgba(0, 51, 153, 0.4), transparent 50%),
        #050011; 
      background-size: 150% 150%;
      animation: moveNebula 20s ease infinite alternate;
      z-index: 0;
    }

    @keyframes moveNebula {
      0% { background-position: 0% 0%; }
      100% { background-position: 100% 100%; }
    }

    .dark-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.3); 
      z-index: 1;
    }

    .content-wrapper {
      position: relative;
      z-index: 2;
    }

    #petalsCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    h1 {
      background: linear-gradient(90deg, #ff33cc, #ff99e6, #ff33cc, #ffccf2);
      background-size: 300% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 25px rgba(255, 51, 204, 0.5);
      animation: titleShine 6s linear infinite;
      margin-top: 30px;
      padding: 0 15px;
    }

    @keyframes titleShine {
      0% { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    .envelope {
      position: relative;
      width: 150px;
      height: 150px;
      margin: 40px auto;
      filter: drop-shadow(0 0 25px rgba(255, 51, 204, 0.5));
    }

    /* CORRECCIÓN: Se le agregó rotate(-45deg) para enderezarlo */
    .heart_love {
      position: absolute;
      width: 120px;
      height: 120px;
      left: 50%;
      transform: translateX(-50%) rotate(-45deg) scale(0.9);
      background: linear-gradient(135deg, #ff3366, #ff0055);
      box-shadow: 0 0 25px #ff3366, 0 0 50px #ff33cc, 0 0 80px rgba(255, 51, 204, 0.4);
      animation: heart 1s infinite;
      margin-top: 15px; /* Pequeño ajuste para que no choque arriba */
    }

    .heart_love::before,
    .heart_love::after {
      content: "";
      position: absolute;
      width: 120px;
      height: 120px;
      background: linear-gradient(135deg, #ff3366, #ff0055);
      border-radius: 50%;
    }

    .heart_love::before { top: -60px; left: 0; }
    .heart_love::after { left: 60px; top: 0; }

    /* CORRECCIÓN: La animación de latido ahora respeta la rotación */
    @keyframes heart {
      0% { transform: translateX(-50%) rotate(-45deg) scale(.9); }
      50% { transform: translateX(-50%) rotate(-45deg) scale(1); }
      100% { transform: translateX(-50%) rotate(-45deg) scale(.9); }
    }

    #countdown { 
      font-size: 24px; 
      margin-top: 40px; 
      color: #fff; 
      text-shadow: 0 0 8px #ff33cc, 0 0 20px #ff33cc, 0 0 15px #000;
      font-weight: bold;
      padding: 0 15px;
      animation: countdownGlow 3s ease-in-out infinite;
    }

    @keyframes countdownGlow {
      0%, 100% { text-shadow: 0 0 8px #ff33cc, 0 0 20px #ff33cc, 0 0 15px #000; }
      50% { text-shadow: 0 0 12px #ff66d9, 0 0 30px #ff33cc, 0 0 15px #000; }
    }

    .tulips-row {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 18px;
      margin-top: 15px;
      padding: 0 10px;
    }

    .tulip-flower {
      width: 46px;
      height: auto;
      transform-origin: bottom center;
      filter: drop-shadow(0 0 6px rgba(255, 111, 174, 0.5));
      animation: tulipSway 3.2s ease-in-out infinite;
    }

    @keyframes tulipSway {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(4deg); }
    }

    .download { margin-top: 30px; display: none; }
    
    .download a {
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      border: 2px solid #ff33cc;
      text-shadow: 0 0 5px #ff33cc;
      box-shadow: 0 0 10px #ff33cc, inset 0 0 5px #ff33cc;
      padding: 12px 24px;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: all 0.3s;
      display: inline-block;
    }

    .download a:hover { 
      background: #ff33cc;
      box-shadow: 0 0 20px #ff33cc, inset 0 0 10px #fff;
    }

    .carousel {
      margin-top: 40px;
      position: relative;
      width: 250px;
      height: 320px;
      margin-left: auto;
      margin-right: auto;
    }

    .carousel img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      
      border: 10px solid #fff;
      border-bottom: 40px solid #fff;
      box-sizing: border-box;
      border-radius: 8px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 25px rgba(255, 51, 204, 0.25);
      
      opacity: 0;
      transform: translateX(100px) translateY(-50px) rotate(20deg);
      z-index: 3; 
      transition: all 1s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .carousel img.active {
      opacity: 1;
      transform: translateX(0) translateY(0) rotate(0deg);
      z-index: 2;
    }

    .carousel img.prev {
      opacity: 0;
      transform: translateX(-40px) translateY(30px) rotate(-15deg);
      z-index: 1; 
    }
  </style>
</head>
<body>

  <canvas id="stars"></canvas>
  <button id="startBtn">INICIAR</button>

  <div id="mainContent">
    <div class="space-nebula"></div>
    <div class="dark-overlay"></div>
    <canvas id="petalsCanvas"></canvas>
    
    <div class="content-wrapper">
      <h1 style="font-family: 'Comic Sans MS', cursive;">💌 Te amo mucho, no olvides lo mucho que la quiero y la amo 💌</h1>
      <div class="envelope"><div class="heart_love"></div></div>
      
      <div id="countdown" style="font-family: 'Comic Sans MS', cursive;"></div>

      <div class="tulips-row" aria-hidden="true">
        <svg class="tulip-flower" style="animation-delay:0s;" viewBox="0 0 60 100" xmlns="http://www.w3.org/2000/svg">

          <path d="M27 78 Q10 72 15 55 Q27 60 27 78 Z" fill="#4caf50"/>
          <path d="M33 84 Q50 78 45 60 Q33 66 33 84 Z" fill="#4caf50"/>
          <path d="M20 25 C12 30 12 45 22 55 C28 45 26 30 20 25 Z" fill="#ff85c1"/>
          <path d="M40 25 C48 30 48 45 38 55 C32 45 34 30 40 25 Z" fill="#ff85c1"/>
          <path d="M30 20 C20 25 18 40 30 55 C42 40 40 25 30 20 Z" fill="#ff6fae"/>
        </svg>
        <svg class="tulip-flower" style="animation-delay:1.2s;" viewBox="0 0 60 100" xmlns="http://www.w3.org/2000/svg">
          <rect x="27" y="55" width="6" height="40" rx="3" fill="#3d8b40"/>
          <path d="M27 78 Q10 72 15 55 Q27 60 27 78 Z" fill="#4caf50"/>
          <path d="M33 84 Q50 78 45 60 Q33 66 33 84 Z" fill="#4caf50"/>
          <path d="M20 25 C12 30 12 45 22 55 C28 45 26 30 20 25 Z" fill="#ff85c1"/>
          <path d="M40 25 C48 30 48 45 38 55 C32 45 34 30 40 25 Z" fill="#ff85c1"/>
          <path d="M30 20 C20 25 18 40 30 55 C42 40 40 25 30 20 Z" fill="#ff6fae"/>
        </svg>
        <svg class="tulip-flower" style="animation-delay:1.8s;" viewBox="0 0 60 100" xmlns="http://www.w3.org/2000/svg">
          <rect x="27" y="55" width="6" height="40" rx="3" fill="#3d8b40"/>
          <path d="M27 78 Q10 72 15 55 Q27 60 27 78 Z" fill="#4caf50"/>
          <path d="M33 84 Q50 78 45 60 Q33 66 33 84 Z" fill="#4caf50"/>
          <path d="M20 25 C12 30 12 45 22 55 C28 45 26 30 20 25 Z" fill="#ff85c1"/>
          <path d="M40 25 C48 30 48 45 38 55 C32 45 34 30 40 25 Z" fill="#ff85c1"/>
          <path d="M30 20 C20 25 18 40 30 55 C42 40 40 25 30 20 Z" fill="#ff6fae"/>
        </svg>
      </div>

      <div class="download" id="downloadBtn">
        <a href="carta.pdf" download>Descargar ¡TU REGALO!</a>
      </div>
      
      <div class="carousel" id="carousel">
        <img src="img1.jpeg" class="active" alt="Foto 1">
        <img src="img2.jpeg" alt="Foto 2">
        <img src="img3.jpeg" alt="Foto 3">
        <img src="img4.jpeg" alt="Foto 4">
        <img src="img5.jpeg" alt="Foto 5">
        <img src="img6.jpeg" alt="Foto 6">
      </div>
    </div>
  </div>

  <audio id="bg-music" loop>
    <source src="musica.mp3" type="audio/mpeg">
  </audio>

  <script>
    const canvas = document.getElementById("stars");
    const ctx = canvas.getContext("2d");
    
    let w, h;
    
    function resizeCanvas() {
      w = window.innerWidth;
      h = window.innerHeight;
      const dpr = Math.min(window.devicePixelRatio || 1, 1.5); 
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let particles = [];
    const numParticles = 7000; 
    let mode = 'starfield'; 
    
    const romanticColors = ['#ff0033', '#ff1a53', '#ff3366', '#ff4d79', '#ff0040'];
    const starfieldColors = ['#ffffff', '#ffe6f7', '#ffd1ec', '#ffb3e0', '#e6ccff'];

    // --- Seguimiento del mouse / touch para el efecto "agua" ---
    let mouseX = -9999, mouseY = -9999;
    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });
    window.addEventListener('mouseleave', () => {
      mouseX = -9999;
      mouseY = -9999;
    });
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        mouseX = e.touches[0].clientX;
        mouseY = e.touches[0].clientY;
      }
    }, { passive: true });
    window.addEventListener('touchend', () => {
      mouseX = -9999;
      mouseY = -9999;
    });

    for (let i = 0; i < numParticles; i++) {
      // fx, fy: posición relativa (0 a 1) de cada punto respecto a la pantalla.
      // Así los puntos quedan quietos en su lugar y se re-acomodan solos si cambia el tamaño de ventana.
      const fx = Math.random();
      const fy = Math.random();
      particles.push({
        fx: fx,
        fy: fy,
        sx: fx * w, 
        sy: fy * h, 
        vx: 0, vy: 0, 
        tx: 0, ty: 0, 
        isHeartPoint: false,
        heartAngle: 0, 
        heartScale: 0, 
        isTulipPoint: false,
        swayPhase: Math.random() * Math.PI * 2,
        swayAmp: 0,
        size: Math.random() * 0.7 + 0.3,
        color: starfieldColors[Math.floor(Math.random() * starfieldColors.length)]
      });
    }

    function getTextPoints(text) {
      const offCanvas = document.createElement('canvas');
      const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });
      offCanvas.width = w;
      offCanvas.height = h;
      
      offCtx.fillStyle = "white";
      offCtx.textAlign = "center";
      offCtx.textBaseline = "middle";
      
      let fontSize = Math.min(w / 4.2, 130);
      offCtx.font = `bold ${fontSize}px Arial, sans-serif`;
      offCtx.fillText(text, w / 2, h / 2);
      
      const imageData = offCtx.getImageData(0, 0, w, h).data;
      let points = [];
      
      for (let y = 0; y < h; y += 2) {
        for (let x = 0; x < w; x += 2) {
          let index = (y * w + x) * 4;
          if (imageData[index + 3] > 128) { 
            points.push({ x: x, y: y });
          }
        }
      }
      return shuffleArray(points);
    }

    // Genera los puntos de 4 tulipanes: pétalos rosados + tallo/hojas verdes
    // Mezcla un array (Fisher-Yates) para repartir bien pétalos y tallo entre las partículas
    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function getTulipPoints() {
      const offCanvas = document.createElement('canvas');
      const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });
      offCanvas.width = w;
      offCanvas.height = h;
      offCtx.fillStyle = "white";

      const tulipCount = 2;
      const spacing = w / (tulipCount + 1);
      const baseY = h * 0.68;      // base del tallo
      const stemTopY = h * 0.40;   // donde empieza la flor
      const scale = Math.min(w, h) / 480 + 1;
      let tulipCenters = [];

      for (let i = 0; i < tulipCount; i++) {
        const cx = spacing * (i + 1);

        // tallo (más ancho para que se note bien)
        offCtx.fillRect(cx - 5 * scale, stemTopY, 10 * scale, baseY - stemTopY);

        // hojas
        offCtx.beginPath();
        offCtx.ellipse(cx - 22 * scale, stemTopY + (baseY - stemTopY) * 0.35, 24 * scale, 9 * scale, -0.4, 0, Math.PI * 2);
        offCtx.fill();
        offCtx.beginPath();
        offCtx.ellipse(cx + 22 * scale, stemTopY + (baseY - stemTopY) * 0.55, 24 * scale, 9 * scale, 0.4, 0, Math.PI * 2);
        offCtx.fill();

        // pétalos (forma de copa del tulipán)
        const flowerCenterY = stemTopY - 26 * scale;
        offCtx.beginPath();
        offCtx.ellipse(cx - 17 * scale, flowerCenterY, 19 * scale, 30 * scale, -0.15, 0, Math.PI * 2);
        offCtx.fill();
        offCtx.beginPath();
        offCtx.ellipse(cx + 17 * scale, flowerCenterY, 19 * scale, 30 * scale, 0.15, 0, Math.PI * 2);
        offCtx.fill();
        offCtx.beginPath();
        offCtx.ellipse(cx, flowerCenterY - 8 * scale, 20 * scale, 32 * scale, 0, 0, Math.PI * 2);
        offCtx.fill();

        tulipCenters.push({ cx, stemTopY, baseY, topY: flowerCenterY - 8 * scale - 32 * scale });
      }

      const imageData = offCtx.getImageData(0, 0, w, h).data;
      let points = [];

      for (let y = 0; y < h; y += 2) {
        for (let x = 0; x < w; x += 2) {
          let index = (y * w + x) * 4;
          if (imageData[index + 3] > 128) {
            let nearest = tulipCenters.reduce((a, b) =>
              Math.abs(b.cx - x) < Math.abs(a.cx - x) ? b : a
            );
            let isStem = y >= nearest.stemTopY - 5 && y <= nearest.baseY && Math.abs(x - nearest.cx) < 30 * scale;
            let heightFrac = (nearest.baseY - y) / (nearest.baseY - nearest.topY);
            heightFrac = Math.max(0, Math.min(1, heightFrac));
            points.push({
              x: x,
              y: y,
              heightFrac: heightFrac,
              color: isStem ? '#3d8b40' : (Math.random() > 0.5 ? '#ff6fae' : '#ff85c1')
            });
          }
        }

      }
      return shuffleArray(points);
    }

    // Parámetros del efecto "agua"
    const influenceRadius = 80;    // qué tan lejos del mouse se sienten empujados los puntos
    const pushStrength = 5.5;      // qué tan fuerte los empuja el mouse
    const springStrength = 0.02;   // qué tan rápido regresan a su lugar (como la tensión del agua)
    const damping = 0.90;          // fricción, evita que oscilen para siempre

    function animate() {
      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
      ctx.fillRect(0, 0, w, h);

      ctx.globalCompositeOperation = "lighter";

      const windTime = performance.now() * 0.001;

      particles.forEach(p => {
        if (mode === 'starfield') {
          const baseX = p.fx * w;
          const baseY = p.fy * h;

          // Empuje tipo "onda de agua" cuando el mouse pasa cerca
          let dx = p.sx - mouseX;
          let dy = p.sy - mouseY;
          let dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < influenceRadius && dist > 0.01) {
            let force = (1 - dist / influenceRadius) * pushStrength;
            p.vx += (dx / dist) * force;
            p.vy += (dy / dist) * force;
          }

          // Resorte que regresa el punto a su posición original
          p.vx += (baseX - p.sx) * springStrength;
          p.vy += (baseY - p.sy) * springStrength;

          // Fricción
          p.vx *= damping;
          p.vy *= damping;

          p.sx += p.vx;
          p.sy += p.vy;

          ctx.beginPath();
          ctx.arc(p.sx, p.sy, p.size, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.fill();

        } else if (mode === 'morphing') {
          if (p.isHeartPoint) {
            p.heartAngle += 0.008; 
            let t = p.heartAngle;
            
            let hx = 16 * Math.pow(Math.sin(t), 3);
            let hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            
            p.tx = (w / 2) + hx * p.heartScale;
            p.ty = (h / 2) + hy * p.heartScale + 20;
          }

          let targetX = p.tx;
          let targetY = p.ty;

          // Efecto de viento: los tulipanes se balancean suavemente,
          // igual que los del contador (más en la flor, casi nada en el tallo).
          if (p.isTulipPoint) {
            targetX += Math.sin(windTime * 1.3 + p.swayPhase) * p.swayAmp;
            targetY += Math.sin(windTime * 0.9 + p.swayPhase) * (p.swayAmp * 0.25);
          }

          if (p.isTulipPoint || p.isHeartPoint) {
            // Corazón y tulipanes: movimiento continuo (resorte con rebote)
            let dx = targetX - p.sx;
            let dy = targetY - p.sy;

            p.vx += dx * 0.0011; 
            p.vy += dy * 0.0011; 
            p.vx *= 0.965; 
            p.vy *= 0.965; 

            p.sx += p.vx;
            p.sy += p.vy;
          } else {
            // Letras: un solo movimiento suave hacia su posición, sin rebote
            p.sx += (targetX - p.sx) * 0.06;
            p.sy += (targetY - p.sy) * 0.06;
          }

          ctx.beginPath();
          ctx.arc(p.sx, p.sy, p.size * 0.8, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.fill();
        }
      });
      
      requestAnimationFrame(animate);
    }
    animate();

    document.getElementById("startBtn").addEventListener("click", () => {
      document.getElementById("startBtn").style.display = "none";
      document.getElementById("bg-music").play().catch(e => console.log("Audio bloqueado"));

      mode = 'morphing';
      particles.forEach(p => {
        p.color = romanticColors[Math.floor(Math.random() * romanticColors.length)];
        p.size = Math.random() * 1.1 + 0.4; 
      });

      // Reservamos un grupo de partículas SOLO para los tulipanes.
      // Estas se quedan formando los tulipanes toda la intro y no las toca
      // ni los mensajes de texto ni los corazones.
      const tulipParticleCount = Math.floor(numParticles * 0.22);
      const tulipPoints = getTulipPoints();
      if (tulipPoints.length > 0) {
        for (let i = 0; i < tulipParticleCount; i++) {
          const p = particles[i];
          p.isTulipPoint = true;
          const pt = tulipPoints[i % tulipPoints.length];
          p.tx = pt.x + (Math.random() - 0.5) * 3;
          p.ty = pt.y + (Math.random() - 0.5) * 3;
          p.color = pt.color;
          p.vx = (Math.random() - 0.5) * 1.4;
          p.vy = (Math.random() - 0.5) * 1.4;
          // Más balanceo (viento) mientras más arriba está el punto (flor),
          // casi nada en la base del tallo, igual que los tulipanes del contador.
          p.swayAmp = 1.5 + pt.heightFrac * 9;
        }
      }

      const timeline = [
        { text: 'te amo', time: 500 },
        { text: 'mi niña', time: 5500 },
        { text: 'preciosa', time: 10500 },
        { text: 'gracias', time: 15500 },
        { text: 'por existir', time: 20500 },
        { text: 'HEARTS', time: 25500 } 
      ];

      timeline.forEach(step => {
        setTimeout(() => {
          if (step.text === 'HEARTS') {
            let baseScale = Math.min(w, h) / 70;
            let scales = [baseScale * 0.5, baseScale * 0.9, baseScale * 1.3, baseScale * 1.7]; 
            
            particles.forEach((p, i) => {
              if (p.isTulipPoint) return;
              p.isHeartPoint = true;
              p.heartScale = scales[i % scales.length]; 
              p.heartAngle = Math.random() * Math.PI * 2; 
              p.vx = (Math.random() - 0.5) * 1.4;
              p.vy = (Math.random() - 0.5) * 1.4;
            });
          } else {
            let targetPoints = getTextPoints(step.text);
            if (targetPoints.length > 0) {
              particles.forEach(p => {
                if (p.isTulipPoint) return;
                p.vx = (Math.random() - 0.5) * 1.4;
                p.vy = (Math.random() - 0.5) * 1.4;
              });

              particles.forEach((p, i) => {
                if (p.isTulipPoint) return;
                p.isHeartPoint = false;
                let pt = targetPoints[i % targetPoints.length];
                p.tx = pt.x + (Math.random() - 0.5) * 4;
                p.ty = pt.y + (Math.random() - 0.5) * 4;
              });
            }
          }
        }, step.time);
      });

      setTimeout(() => {
        canvas.style.opacity = 0; 
        setTimeout(() => {
          canvas.style.display = "none";
          document.getElementById("mainContent").style.display = "block";
          document.body.style.overflow = "auto";
          updateCountdown();
          setInterval(updateCountdown, 1000);
          startCarousel(); 
          startPetals();
        }, 2000); 
      }, 33500); 
    });

    let targetDate = new Date("August 17, 2026 09:00:00"); 
    function updateCountdown() {
      let now = new Date();
      let diff = targetDate - now;
      if (diff <= 0) {
        document.getElementById("countdown").innerHTML = "¡Todo fue hecho con mucho amor feliz 17 TE AMO!";
        document.getElementById("downloadBtn").style.display = "block";
        return;
      }
      let days = Math.floor(diff / (1000 * 60 * 60 * 24));
      let hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      let minutes = Math.floor((diff / (1000 * 60)) % 60);
      let seconds = Math.floor((diff / 1000) % 60);
      document.getElementById("countdown").innerHTML = `Faltan: ${days}d ${hours}h ${minutes}m ${seconds}s`;
    }

    function startCarousel() {
      const images = document.querySelectorAll("#carousel img");
      let index = 0;
      
      setInterval(() => {
        images[index].className = "prev";
        index = (index + 1) % images.length;
        images[index].className = "active";
        
        images.forEach((img, i) => {
          if (i !== index && img.className !== "prev") {
            img.className = ""; 
          }
        });
      }, 3500);
    }

    // --- Pétalos de tulipán cayendo en la sección del contador ---
    function startPetals() {
      const petalsCanvas = document.getElementById('petalsCanvas');
      const petalsCtx = petalsCanvas.getContext('2d');
      let pw, ph;

      function resizePetalsCanvas() {
        pw = window.innerWidth;
        ph = window.innerHeight;
        const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
        petalsCanvas.width = pw * dpr;
        petalsCanvas.height = ph * dpr;
        petalsCanvas.style.width = pw + "px";
        petalsCanvas.style.height = ph + "px";
        petalsCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener('resize', resizePetalsCanvas);
      resizePetalsCanvas();

      const petalColors = ['#ff6fae', '#ff85c1', '#ffb3d9', '#ff4d94', '#ffccf2'];
      const petalCount = 220; // muchos pétalos
      let petals = [];

      function createPetal(startAnywhere) {
        return {
          x: Math.random() * pw,
          y: startAnywhere ? Math.random() * ph : -20 - Math.random() * 200,
          size: Math.random() * 7 + 5,
          speedY: Math.random() * 1.1 + 0.5,
          swayAmp: Math.random() * 25 + 10,
          swayFreq: Math.random() * 0.8 + 0.4,
          phase: Math.random() * Math.PI * 2,
          rotation: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.04,
          color: petalColors[Math.floor(Math.random() * petalColors.length)]
        };
      }

      for (let i = 0; i < petalCount; i++) {
        petals.push(createPetal(true));
      }

      function drawPetal(p) {
        petalsCtx.save();
        petalsCtx.translate(p.x, p.y);
        petalsCtx.rotate(p.rotation);
        petalsCtx.fillStyle = p.color;
        petalsCtx.beginPath();
        petalsCtx.moveTo(0, -p.size);
        petalsCtx.quadraticCurveTo(p.size * 0.7, -p.size * 0.2, 0, p.size);
        petalsCtx.quadraticCurveTo(-p.size * 0.7, -p.size * 0.2, 0, -p.size);
        petalsCtx.fill();
        petalsCtx.restore();
      }

      let petalTime = 0;
      function animatePetals() {
        petalsCtx.clearRect(0, 0, pw, ph);
        petalTime += 0.02;

        petals.forEach(p => {
          p.y += p.speedY;
          p.x += Math.sin(petalTime * p.swayFreq + p.phase) * 0.7;
          p.rotation += p.rotSpeed;

          if (p.y > ph + 20) {
            p.y = -20 - Math.random() * 100;
            p.x = Math.random() * pw;
          }

          drawPetal(p);
        });

        requestAnimationFrame(animatePetals);
      }
      animatePetals();
    }
  </script>
</body>
